<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitud de Proyecto - PrintNova Solutions</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #030712 100%);
      --card-bg: rgba(15, 23, 42, 0.85);
      --card-border: rgba(56, 189, 248, 0.25);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-cyan: #38bdf8;
      --accent-blue: #6366f1;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --input-bg: rgba(30, 41, 59, 0.7);
      --input-border: rgba(148, 163, 184, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 30px 15px;
    }

    .form-container {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px var(--accent-glow);
      width: 100%;
      max-width: 760px;
      padding: 40px;
    }

    .form-header {
      text-align: center;
      margin-bottom: 32px;
    }

    /* Estilo para el Logo */
    .company-logo {
      max-width: 40px;
      height: auto;
      margin-bottom: 16px;
      display: inline-block;
      filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4));
    }

    .form-header h2 {
      font-size: 30px;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .form-header p {
      color: var(--text-secondary);
      font-size: 15px;
      margin-top: 6px;
    }

    /* Grid para organizar el formulario */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .full-width {
      grid-column: span 2;
    }

    label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--accent-cyan);
      margin-bottom: 8px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 16px;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      font-size: 14px;
      color: var(--text-primary);
      transition: all 0.3s ease;
    }

    input[type="date"] {
      color-scheme: dark;
    }

    select option {
      background-color: #0f172a;
      color: #f8fafc;
    }

    input::placeholder, textarea::placeholder {
      color: #64748b;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-cyan);
      background-color: rgba(30, 41, 59, 0.95);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    button {
      grid-column: span 2;
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #6366f1 100%);
      color: #ffffff;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(2, 132, 199, 0.4);
      margin-top: 10px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.6);
      background: linear-gradient(135deg, #38bdf8 0%, #4f46e5 100%);
    }

    @media (max-width: 640px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      .full-width, button {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>

  <div class="form-container">
    <div class="form-header">
      
      <!-- ========================================================= -->
      <!-- 🖼️ PEGA LA URL DE TU LOGO EN EL ESPACIO DE ABAJO: -->
      <!-- ========================================================= -->
      <img src="https://github.com/fatimamancia/images/blob/main/6cdc6298-c8cc-4d34-8b19-5cf8bb1ec50d.jpg?raw=true">
      
      <h2>PrintNova Solutions</h2>
      <p>Formulario de Registro de Proyecto</p>
    </div>

    <!-- ========================================================= -->
    <!-- 🔗 PEGA TU WEBHOOK URL DE N8N EN EL ESPACIO DE ABAJO: -->
    <!-- ========================================================= -->
    <form action="PEGA_AQUI_TU_WEBHOOK_URL_DE_N8N" method="POST" class="form-grid">
      
      <!-- 1. Fecha -->
      <div class="form-group">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" name="fecha" required>
      </div>

      <!-- 2. Nombre -->
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" required>
      </div>

      <!-- 3. Correo -->
      <div class="form-group">
        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required>
      </div>

      <!-- 4. Teléfono -->
      <div class="form-group">
        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" name="telefono" placeholder="+503 0000 0000" required>
      </div>

      <!-- 5. Empresa -->
      <div class="form-group">
        <label for="empresa">Empresa</label>
        <input type="text" id="empresa" name="empresa" placeholder="Nombre de la empresa">
      </div>

      <!-- 6. Proyecto -->
      <div class="form-group">
        <label for="proyecto">Proyecto</label>
        <input type="text" id="proyecto" name="proyecto" placeholder="Nombre del proyecto" required>
      </div>

      <!-- 7. Categoría -->
      <div class="form-group">
        <label for="categoria">Categoría</label>
        <select id="categoria" name="categoria" required>
          <option value="" disabled selected>Selecciona una opción</option>
          <option value="Impresión 3D">Impresión 3D</option>
          <option value="Corte y Grabado Láser">Corte y Grabado Láser</option>
          <option value="Impresión Gran Formato">Impresión Gran Formato</option>
          <option value="Promocionales / Merchandising">Promocionales / Merchandising</option>
          <option value="Diseño CAD / Modelado">Diseño CAD / Modelado</option>
          <option value="Otro">Otro Servicio</option>
        </select>
      </div>

      <!-- 8. Material -->
      <div class="form-group">
        <label for="material">Material</label>
        <input type="text" id="material" name="material" placeholder="Ej. Acrílico, PLA, Vinilo">
      </div>

      <!-- 9. Color -->
      <div class="form-group">
        <label for="color">Color</label>
        <input type="text" id="color" name="color" placeholder="Color deseado">
      </div>

      <!-- 10. Cantidad -->
      <div class="form-group">
        <label for="cantidad">Cantidad</label>
        <input type="number" id="cantidad" name="cantidad" min="1" placeholder="1" required>
      </div>

      <!-- 11. Medidas -->
      <div class="form-group">
        <label for="medidas">Medidas</label>
        <input type="text" id="medidas" name="medidas" placeholder="Ej. 30x40 cm">
      </div>

      <!-- 12. Fecha de Entrega -->
      <div class="form-group">
        <label for="fecha_entrega">Fecha de Entrega</label>
        <input type="date" id="fecha_entrega" name="fecha_entrega" required>
      </div>

      <!-- 13. Descripción -->
      <div class="form-group full-width">
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" name="descripcion" rows="3" placeholder="Detalles técnicos o especificaciones del proyecto..."></textarea>
      </div>

      <!-- 14. Observaciones -->
      <div class="form-group full-width">
        <label for="observaciones">Observaciones</label>
        <textarea id="observaciones" name="observaciones" rows="2" placeholder="Notas adicionales o requerimientos especiales..."></textarea>
      </div>

      <button type="submit">Enviar Solicitud a PrintNova</button>
    </form>
  </div>

  <script>
    // Asigna automáticamente la fecha de hoy al cargar la página
    document.getElementById('fecha').valueAsDate = new Date();
  </script>
</body>
</html>
